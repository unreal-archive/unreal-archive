subprojects {
	group = 'org.unrealarchive'
	version = "1.25"
	if (System.getenv().containsKey("BUILD_NUMBER")) {
		version += ".${System.env.BUILD_NUMBER}"
	} else version += ".DEV"

	apply plugin: 'java'
	apply plugin: 'maven-publish'
	apply plugin: 'jacoco'

	compileJava {
		options.release = 25
	}

	repositories {
		mavenCentral()
		maven {
			url = "https://git.pookaroo.au/api/packages/shrimp/maven"
			credentials(HttpHeaderCredentials) {
				name = "Authorization"
				value = "token ${providers.gradleProperty("packagesReadToken").get()}"
			}
			authentication {
				header(HttpHeaderAuthentication)
			}
		}
	}

	publishing {
		repositories {
			maven {
				name = "ShrimpWorks"
				url = 'https://git.pookaroo.au/api/packages/shrimp/maven'
				credentials(HttpHeaderCredentials) {
					name = "Authorization"
					value = "token ${System.env.PACKAGES_TOKEN}"
				}

				authentication {
					header(HttpHeaderAuthentication)
				}
			}
		}
		publications {
			maven(MavenPublication) {
				from components.java
			}
		}
	}

	/**
	 * Conditionally publish jlink'd binary if present in subproject
	 */
	afterEvaluate {
		def tarTask = tasks.findByName('jlinkTar')
		if (tarTask) {
			publishing.publications.maven.artifact(tarTask) {
				classifier = 'bin'
				extension = 'tgz'
			}
		}
	}

	/**
	 * Verifies every module this build *generates* reads all the modules its classes use: the merged module
	 * holding the non-modular dependencies, and any module-info synthesised into a third-party jar.
	 *
	 * The jlink plugin infers the merged module's `requires` by scanning `$JAVA_HOME/jmods` for a package to
	 * module map, and silently declares nothing it cannot resolve - so JDKs built with JEP 493 linkable
	 * runtimes, which ship no `jmods` directory, produce a merged module reading only java.base and an image
	 * missing modules entirely. The scan also misses some references jdeps finds. Synthesised module-infos
	 * are only as complete as their hand-written `requires` list.
	 *
	 * Either way the result is an IllegalAccessError the first time the undeclared code path runs, so it is
	 * worth failing the build instead. jdeps reports what the classes really need, independently of the
	 * build JDK's packaging.
	 */
	plugins.withId('org.beryx.jlink') {
		def checkModuleReads = tasks.register('checkModuleReads') {
			group = 'verification'
			description = 'Checks that generated modules read every module their classes use'
			// jlinkjars is only complete after prepareModulesDir: it adds the delegating modules, the
			// remaining modular jars, and rewrites descriptors of jars whose dependencies were merged away
			dependsOn tasks.named('prepareModulesDir')

			def jlinkBase = layout.buildDirectory.dir('jlinkbase')
			def buildFileName = rootDir.toPath().relativize(buildFile.toPath()).toString()
			def release = JavaVersion.current().majorVersion

			doLast {
				def base = jlinkBase.get().asFile
				def jlinkJars = new File(base, 'jlinkjars')
				def finder = java.lang.module.ModuleFinder.compose(
						java.lang.module.ModuleFinder.of(jlinkJars.toPath()),
						java.lang.module.ModuleFinder.ofSystem())
				def descriptorOf = { File jar ->
					java.lang.module.ModuleFinder.of(jar.toPath()).findAll().first().descriptor()
				}

				// modules readable from the given one: its own requires, plus `requires transitive` chains
				def readableFrom = { java.lang.module.ModuleDescriptor descriptor ->
					Set<String> readable = []
					def queue = new ArrayDeque<String>(descriptor.requires()*.name())
					while (!queue.isEmpty()) {
						def name = queue.poll()
						if (!readable.add(name)) continue
						finder.find(name).ifPresent { ref ->
							ref.descriptor().requires().each { req ->
								if (req.modifiers().contains(
										java.lang.module.ModuleDescriptor.Requires.Modifier.TRANSITIVE)) {
									queue.add(req.name())
								}
							}
						}
					}
					readable
				}

				// the merged module is checked against its classes as they were before module-info was
				// attached, since jdeps reports only declared requires for an already modular jar
				def mergedClasses = new File(base, 'tmpmerged').listFiles()?.find { it.name.endsWith('.jar') }
				def mergedModule = jlinkJars.listFiles()?.find {
					it.name.contains('merged') && it.name.endsWith('.jar')
				}
				if (!mergedClasses || !mergedModule) throw new GradleException(
						"No merged module found under $base - expected tmpmerged/ and jlinkjars/ jars")

				def targets = [[mergedClasses, mergedModule, 'jlink { mergedModule { ... } }']]
				jlinkJars.listFiles()?.findAll { it.name.endsWith('-module.jar') }?.each {
					targets << [it, it, "extraJavaModuleInfo { module('...', '${descriptorOf(it).name()}') { ... } }"]
				}

				logger.info("Auditing generated modules: {}", targets.collect { it[0].name })
				def jdeps = java.util.spi.ToolProvider.findFirst('jdeps')
						.orElseThrow { new GradleException('jdeps is unavailable in the Gradle JVM') }
				def problems = []
				targets.each { classesJar, moduleJar, where ->
					def descriptor = descriptorOf(moduleJar)
					def args = ['-s', '--multi-release', release, '--module-path', jlinkJars.path]
					if (classesJar == moduleJar) args += ['--add-modules', descriptor.name()]
					def report = new StringWriter()
					def errors = new StringWriter()
					if (jdeps.run(new PrintWriter(report), new PrintWriter(errors),
								  (args + classesJar.path) as String[]) != 0) {
						throw new GradleException("jdeps failed on ${classesJar.name}: $errors")
					}

					// "jar -> module" per used module, plus pseudo-entries ("not found") to ignore
					def used = report.toString().readLines()
							.findAll { it.contains(' -> ') }
							.collect { (it =~ / -> (\S+)$/).with { m -> m ? m[0][1] : null } }
							.findAll { it ==~ /(?!java\.base$)[a-z][a-zA-Z0-9.]*/ } as Set

					def missing = (used - readableFrom(descriptor)).sort()
					if (missing) problems << "${descriptor.name()} does not read ${missing.join(', ')}\n" +
							"\tdeclare in $buildFileName, $where:\n" +
							missing.collect { "\t\trequires '$it'" }.join('\n')
				}

				if (problems) throw new GradleException(
						"Generated modules are missing readability edges, which fail at runtime as an " +
						"IllegalAccessError:\n" + problems.join('\n') +
						"\nIn an `additive = true` mergedModule block, also `excludeRequires` those modules, " +
						"so they are not declared twice.")
			}
		}

		tasks.named('check') { dependsOn checkModuleReads }
		tasks.named('jlink') { dependsOn checkModuleReads }
	}

	dependencies {
		testRuntimeOnly('org.junit.platform:junit-platform-launcher')
	}

	test {
		useJUnitPlatform()
	}

	jacocoTestReport {
		reports {
			xml.required = true
		}
	}
}
